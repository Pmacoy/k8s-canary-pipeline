[project]
name = "canary-demo"
version = "0.1.0"
description = "Demo app used to prove out an automated Argo Rollouts canary"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]
# S104 (bind-all-interfaces) is suppressed inline, per line, in app/main.py
# rather than globally here -- it's only correct on that one dev-entrypoint
# line, not as a blanket exemption for the whole codebase.

[tool.ruff.lint.per-file-ignores]
# S101 (use of `assert`) is pytest's own idiom, not a real risk -- asserts
# in test files never ship to production and are how pytest itself expects
# assertions to be written.
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, `from app import main` in tests/test_api.py only resolves
# when pytest happens to be invoked from a shell that already has the repo
# root on PYTHONPATH -- explicit beats implicit, and this is what actually
# keeps CI and a local `pytest` run behaving the same way.
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"
